name: Deploy to Sakura Internet

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP (lftp)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u fukamekizakkaten,"$FTP_PASSWORD" fukamekizakkaten.sakura.ne.jp <<'EOF'
          set ftp:passive-mode on
          set net:timeout 30
          set net:max-retries 3
          set ssl:verify-certificate no
          mirror -R \
            --exclude-glob .git* \
            --exclude-glob .claude/ \
            --exclude-glob gen_*.py \
            --exclude-glob CLAUDE.md \
            --exclude-glob .github/ \
            . /www/
          quit
          EOF
